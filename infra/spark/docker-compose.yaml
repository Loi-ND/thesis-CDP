services:
  spark-master:
    image: loind31/spark:v0
    container_name: spark-master
    hostname: spark-master
    command: >
      bash -c "$$SPARK_HOME/sbin/start-master.sh &&
      tail -f $$SPARK_HOME/logs/*"
    ports:
      - "7077:7077"
      - "8079:8080"
    cpus: 1
    mem_limit: 2g

  spark-worker-1:
    image: loind31/spark:v0
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: >
      bash -c "$$SPARK_HOME/sbin/start-worker.sh
      spark://spark-master:7077 &&
      tail -f $$SPARK_HOME/logs/*"
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4g
    cpus: 4
    mem_limit: 5g
    ports:
      - "8081:8081"

  spark-worker-2:
    image: loind31/spark:v0
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: >
      bash -c "$$SPARK_HOME/sbin/start-worker.sh
      spark://spark-master:7077 &&
      tail -f $$SPARK_HOME/logs/*"
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4g
    cpus: 4
    mem_limit: 5g
    ports:
      - "8082:8081"
  
  jupyter:
    image: loind31/jupyter-spark:v0
    container_name: jupyter
    hostname: jupyter

    cpus: 2
    mem_limit: 3g

    ports:
      - "8888:8888"

    environment:
      JUPYTER_TOKEN: "spark123"

      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3

    command:
      - bash
      - -lc
      - |
        exec jupyter lab \
          --ip=0.0.0.0 \
          --port=8888 \
          --no-browser \
          --allow-root \
          --ServerApp.token=spark123

    volumes:
      - ./notebooks:/workspace/notebooks
services:
  kafdrop:
    image: obsidiandynamics/kafdrop:4.2.0
    container_name: kafdrop
    ports:
    - 9000:9000
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 0.5G
    environment:
        KAFKA_BROKERCONNECT: "kafka-server:9091"

  kafka-server:
    hostname: kafka-server
    container_name: kafka-server
    image: loind31/kafka:v2
    volumes:
      - ./data:/workspace/kafka/data
      - ./src/python/kafka:/workspace/kafka/src
      - ./infra/kafka/config/cluster.id:/cluster.id
      - ./infra/kafka/config/standalone:/workspace/kafka/config
      - ./infra/kafka/config/server-uuid:/workspace/kafka/server-uuid
      - ./infra/kafka/config/standalone-entrypoint.sh:/entrypoint.sh
      - kafka-data:/workspace/kafka/logs
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
    ports:
      - 9091:9091
    command: ["/bin/bash", "/entrypoint.sh"]
  
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka-data:
  pgdata: